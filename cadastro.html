<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONG Esperança - Cadastro</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- CABEÇALHO -->
    <header>

        <div class="logo">

            <img
                src="imagens/logo.png"
                alt="Logo da ONG Esperança">

        </div>


        <button
            class="menu-toggle"
            aria-label="Abrir menu">

            ☰

        </button>


        <nav class="menu">

            <ul>

                <li>
                    <a href="index.html">
                        Início
                    </a>
                </li>

                <li>
                    <a href="projetos.html">
                        Projetos
                    </a>
                </li>

                <li>
                    <a href="index.html#doacoes">
                        Doações
                    </a>
                </li>

                <li>
                    <a href="index.html#contato">
                        Contato
                    </a>
                </li>

                <li>
                    <a href="cadastro.html">
                        Cadastro
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- FORMULÁRIO -->
    <main>

        <section class="container formulario-container">

            <h1>Cadastro de voluntário</h1>

            <p>
                Preencha seus dados para demonstrar interesse
                em participar das nossas ações.
            </p>


            <form id="formCadastro">


                <!-- DADOS PESSOAIS -->
                <fieldset>

                    <legend>
                        Dados pessoais
                    </legend>


                    <div class="form-grupo">

                        <label for="nome">
                            Nome completo:
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            required
                            minlength="3"
                            placeholder="Digite seu nome completo">

                    </div>


                    <div class="form-grupo">

                        <label for="email">
                            E-mail:
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            placeholder="exemplo@email.com">

                    </div>


                    <div class="form-grupo">

                        <label for="nascimento">
                            Data de nascimento:
                        </label>

                        <input
                            type="date"
                            id="nascimento"
                            name="nascimento"
                            required>

                    </div>


                    <div class="form-grupo">

                        <label for="cpf">
                            CPF:
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            required
                            placeholder="000.000.000-00"
                            pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                            title="Digite um CPF válido no formato 000.000.000-00">

                    </div>


                    <div class="form-grupo">

                        <label for="telefone">
                            Telefone:
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            required
                            placeholder="(11) 99999-9999"
                            pattern="\([0-9]{2}\)\s?[0-9]{4,5}-?[0-9]{4}"
                            title="Digite um telefone válido">

                    </div>

                </fieldset>


                <!-- ENDEREÇO -->
                <fieldset>

                    <legend>
                        Endereço
                    </legend>


                    <div class="form-grupo">

                        <label for="endereco">
                            Endereço:
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            required>

                    </div>


                    <div class="form-grupo">

                        <label for="cidade">
                            Cidade:
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            required>

                    </div>


                    <div class="form-grupo">

                        <label for="estado">
                            Estado:
                        </label>

                        <select
                            id="estado"
                            name="estado"
                            required>

                            <option value="">
                                Selecione
                            </option>

                            <option value="SP">
                                São Paulo
                            </option>

                            <option value="RJ">
                                Rio de Janeiro
                            </option>

                            <option value="MG">
                                Minas Gerais
                            </option>

                            <option value="PR">
                                Paraná
                            </option>

                            <option value="SC">
                                Santa Catarina
                            </option>

                            <option value="RS">
                                Rio Grande do Sul
                            </option>

                        </select>

                    </div>


                    <div class="form-grupo">

                        <label for="cep">
                            CEP:
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            required
                            placeholder="00000-000"
                            pattern="[0-9]{5}-?[0-9]{3}"
                            title="Digite um CEP válido no formato 00000-000">

                    </div>

                </fieldset>


                <!-- INTERESSE -->
                <fieldset>

                    <legend>
                        Área de interesse
                    </legend>


                    <div class="form-grupo">

                        <label for="area">
                            Como deseja ajudar?
                        </label>

                        <select
                            id="area"
                            name="area"
                            required>

                            <option value="">
                                Selecione uma opção
                            </option>

                            <option value="doacao">
                                Campanhas de doação
                            </option>

                            <option value="social">
                                Ações sociais
                            </option>

                            <option value="eventos">
                                Eventos
                            </option>

                            <option value="comunicacao">
                                Comunicação
                            </option>

                        </select>

                    </div>


                    <div class="form-grupo">

                        <label for="mensagem">
                            Conte um pouco sobre você:
                        </label>

                        <textarea
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            placeholder="Digite sua mensagem">

                        </textarea>

                    </div>

                </fieldset>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="btn">

                    Enviar cadastro

                </button>


            </form>


            <!-- ALERTA -->
            <div
                id="alertaCadastro"
                class="alert alert-sucesso"
                hidden>

                Cadastro realizado com sucesso!

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 ONG Esperança - Todos os direitos reservados.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
